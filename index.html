<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>RozFit – your daily gym plan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{--bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#e2e8f0;--mut:#94a3b8;--acc:#22c55e;--acc2:#16a34a;--warn:#f59e0b;--bad:#ef4444;--blue:#38bdf8}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{max-width:560px;margin:0 auto;padding:16px 16px 96px}
  h1{font-size:24px;margin:8px 0 4px} h2{font-size:19px;margin:18px 0 8px} h3{font-size:16px;margin:0 0 6px}
  p{margin:6px 0} .mut{color:var(--mut);font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
  label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
  input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0b1222;color:var(--txt);font-size:16px}
  .row{display:flex;gap:10px} .row>*{flex:1}
  .btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#04210f;font-weight:700;font-size:16px;margin-top:16px;cursor:pointer}
  .btn.sec{background:transparent;color:var(--txt);border:1px solid var(--line)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:#0b1222;color:var(--txt);cursor:pointer;font-size:15px;user-select:none}
  .chip.on{background:var(--acc);color:#04210f;border-color:var(--acc);font-weight:700}
  nav{position:fixed;bottom:0;left:0;right:0;background:#0b1222;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
  nav div{display:flex;max-width:560px;width:100%}
  nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0 12px;font-size:12px;cursor:pointer}
  nav button b{display:block;font-size:20px;margin-bottom:2px}
  nav button.on{color:var(--acc)}
  .ex{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
  .ex:first-of-type{border-top:0}
  .ex input[type=checkbox]{width:28px;height:28px;flex:none;accent-color:var(--acc);margin-top:2px}
  .ex.done .nm{text-decoration:line-through;color:var(--mut)}
  .nm{font-weight:600} .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:#0b1222;border:1px solid var(--line);color:var(--mut);margin-right:4px}
  .vid{display:inline-block;margin-top:6px;font-size:14px;color:var(--blue);text-decoration:none}
  .vid.sm{font-size:13px;color:var(--mut);text-decoration:underline}
  .soon{display:inline-block;margin-top:6px;font-size:13px;padding:3px 10px;border-radius:999px;background:#0b1222;border:1px dashed var(--line);color:var(--mut)}
  .bar{height:10px;background:#0b1222;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
  .big{font-size:34px;font-weight:800}
  .stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat .card{margin:0;text-align:center}
  .day{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
  .today{border-color:var(--acc)}
  .hide{display:none}
  .banner{background:linear-gradient(135deg,#14532d,#0f172a);border-color:#166534}
  .timer{font-size:28px;font-weight:800;text-align:center}
  ul{padding-left:20px;margin:6px 0} li{margin:4px 0}
  .warn{color:var(--warn)}
  table{width:100%;border-collapse:collapse;font-size:14px} td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav" class="hide"><div>
  <button data-tab="today"><b>✅</b>Today</button>
  <button data-tab="week"><b>📅</b>Week</button>
  <button data-tab="diet"><b>🥗</b>Diet</button>
  <button data-tab="me"><b>👤</b>Me</button>
</div></nav>

<script>
/* =========================================================
   RozFit prototype — everything runs in the browser.
   Data is saved on the phone only (localStorage). No account, no server.
   ========================================================= */

const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DAY_FULL = {Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday",Fri:"Friday",Sat:"Saturday",Sun:"Sunday"};

/* ---------- Exercise library ----------
   g = gym version, h = home / no-equipment version
   cue = one-line form tip shown under the exercise */
const LIB = {
  chest:[
    {g:"Barbell bench press",h:"Push-ups",cue:"Shoulder blades squeezed, lower slowly to chest."},
    {g:"Incline dumbbell press",h:"Feet-elevated push-ups",cue:"Elbows at about 45°, not flared out."},
    {g:"Cable chest fly",h:"Wide push-ups",cue:"Slight bend in elbows, squeeze at the middle."}],
  back:[
    {g:"Lat pulldown",h:"Towel door rows",cue:"Pull elbows down to your ribs, chest up."},
    {g:"Seated cable row",h:"Superman hold",cue:"Keep back straight, pull to belly button."},
    {g:"Dumbbell one-arm row",h:"Reverse snow angels",cue:"Pull the weight towards your hip."}],
  shoulders:[
    {g:"Seated dumbbell shoulder press",h:"Pike push-ups",cue:"Press straight up, don't arch your lower back."},
    {g:"Dumbbell lateral raise",h:"Arm circles (slow)",cue:"Lift to shoulder height, lead with elbows."},
    {g:"Face pull",h:"Prone Y-T raises",cue:"Pull rope to your forehead, elbows high."}],
  biceps:[
    {g:"Dumbbell biceps curl",h:"Backpack curls",cue:"Elbows stay by your sides, no swinging."},
    {g:"Hammer curl",h:"Towel isometric curl",cue:"Thumbs up, slow on the way down."}],
  triceps:[
    {g:"Cable triceps pushdown",h:"Bench / chair dips",cue:"Elbows pinned, straighten arms fully."},
    {g:"Overhead dumbbell triceps extension",h:"Diamond push-ups",cue:"Keep elbows pointing forward."}],
  quads:[
    {g:"Barbell back squat",h:"Bodyweight squats",cue:"Chest up, knees follow toes, hips below knees if you can."},
    {g:"Leg press",h:"Reverse lunges",cue:"Push through the whole foot, don't lock knees."},
    {g:"Leg extension",h:"Wall sit",cue:"Pause at the top, lower slowly."}],
  hamstrings:[
    {g:"Romanian deadlift",h:"Single-leg hip hinge",cue:"Push hips back, bar close to legs, flat back."},
    {g:"Lying leg curl",h:"Glute bridge",cue:"Squeeze at the top, slow on the way down."}],
  glutes:[
    {g:"Barbell hip thrust",h:"Single-leg glute bridge",cue:"Chin tucked, squeeze glutes hard at the top."},
    {g:"Walking lunges",h:"Step-ups on a stair",cue:"Long steps, front knee over the ankle."}],
  calves:[
    {g:"Standing calf raise",h:"Stair calf raises",cue:"Full stretch at bottom, pause at the top."}],
  abs:[
    {g:"Plank",h:"Plank",cue:"Straight line head to heels, squeeze glutes.",time:true},
    {g:"Hanging knee raise",h:"Lying leg raise",cue:"Lower back pressed down, no swinging."},
    {g:"Cable crunch",h:"Crunches",cue:"Curl ribs towards hips, don't pull your neck."},
    {g:"Russian twist",h:"Russian twist",cue:"Rotate from the chest, feet down if it hurts."},
    {g:"Bicycle crunch",h:"Bicycle crunch",cue:"Slow and controlled, elbow towards opposite knee."},
    {g:"Mountain climbers",h:"Mountain climbers",cue:"Hips low, drive knees fast.",time:true}],
  hiit:[
    {g:"Jumping jacks",h:"Jumping jacks"},
    {g:"Burpees",h:"Burpees"},
    {g:"High knees",h:"High knees"},
    {g:"Squat jumps",h:"Squat jumps"},
    {g:"Skater hops",h:"Skater hops"},
    {g:"Rowing machine sprint",h:"Fast feet shuffle"}],
};

/* Which muscle groups each type of day trains */
const DAY_TYPES = {
  full:  {name:"Full body",  groups:["quads","chest","back","shoulders","hamstrings","abs"]},
  fullB: {name:"Full body B",groups:["glutes","chest","back","shoulders","biceps","triceps"]},
  upper: {name:"Upper body", groups:["chest","back","shoulders","biceps","triceps"]},
  lower: {name:"Lower body", groups:["quads","hamstrings","glutes","calves"]},
  push:  {name:"Push (chest, shoulders, triceps)",groups:["chest","chest","shoulders","shoulders","triceps"]},
  pull:  {name:"Pull (back, biceps)",groups:["back","back","back","biceps","biceps"]},
  legs:  {name:"Legs",groups:["quads","quads","hamstrings","glutes","calves"]},
  hiitAbs:{name:"HIIT + Abs",groups:[]},
};

/* Split chosen by number of days the person can train */
const SPLITS = {
  1:["full"],
  2:["full","fullB"],
  3:["full","fullB","full"],
  4:["upper","lower","upper","lower"],
  5:["push","pull","legs","upper","lower"],
  6:["push","pull","legs","push","pull","legs"],
  7:["push","pull","legs","hiitAbs","upper","lower","hiitAbs"],
};

/* ---------- Storage ---------- */
const S = {
  get(k,d){try{return JSON.parse(localStorage.getItem("rozfit_"+k))??d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("rozfit_"+k,JSON.stringify(v))}catch(e){}},
};
let profile = S.get("profile",null);
let tab = "today";
let viewDay = null; // when user taps a day in Week view

/* ---------- Maths ---------- */
function bmi(p){const m=p.heightCm/100;return p.weightKg/(m*m)}
function bmiCat(b,asian){
  // WHO cut-offs; South Asian cut-offs (WHO Asia expert consultation 2004) are lower.
  if(asian){ if(b<18.5)return["Underweight","warn"]; if(b<23)return["Healthy","ok"]; if(b<27.5)return["Overweight","warn"]; return["Obese","bad"]; }
  if(b<18.5)return["Underweight","warn"]; if(b<25)return["Healthy","ok"]; if(b<30)return["Overweight","warn"]; return["Obese","bad"];
}
function healthyRange(p){const m=p.heightCm/100;const hi=p.asian?22.9:24.9;return[(18.5*m*m).toFixed(0),(hi*m*m).toFixed(0)]}
function bmr(p){ // Mifflin-St Jeor
  const base=10*p.weightKg+6.25*p.heightCm-5*p.age; return p.sex==="male"?base+5:base-161;
}
function calories(p){
  const act = 1.2 + 0.075*p.days.length; // rough: sedentary + training days
  const tdee = bmr(p)*act;
  let target = tdee;
  if(p.goal==="lose") target = tdee-500;
  if(p.goal==="muscle") target = tdee+250;
  const floor = p.sex==="male"?1500:1200;
  target = Math.max(target,floor);
  const protein = Math.round(p.weightKg*(p.goal==="muscle"?1.8:p.goal==="lose"?1.6:1.4));
  return {tdee:Math.round(tdee),target:Math.round(target/10)*10,protein,water:(p.weightKg*0.033).toFixed(1)};
}

/* ---------- Plan generator ---------- */
function setsReps(p,group){
  if(group==="abs") return p.level==="beginner"?"2 × 12 (or 30 sec)":p.level==="advanced"?"4 × 15 (or 60 sec)":"3 × 15 (or 45 sec)";
  const sets = p.level==="beginner"?3:p.level==="advanced"?4:3;
  const reps = p.goal==="muscle"?"8–12":p.goal==="lose"?"12–15":"10–12";
  return `${sets} × ${reps}`;
}
function hiitBlock(p){
  const rounds = p.level==="beginner"?3:p.level==="advanced"?5:4;
  const work = p.level==="beginner"?20:p.level==="advanced"?40:30;
  return {rounds,work,rest:60-work};
}
function buildPlan(p){
  const split = SPLITS[p.days.length];
  const counters = {};               // rotate exercise variations across the week
  const plan = {};
  const sorted = DAYS.filter(d=>p.days.includes(d));
  sorted.forEach((d,i)=>{
    const type = split[i]; const t = DAY_TYPES[type];
    const items = [];
    const maxMain = p.minutes<=30?4:p.minutes<=45?5:6;
    t.groups.slice(0,maxMain).forEach(gp=>{
      const list = LIB[gp]; counters[gp]=(counters[gp]??(i%list.length));
      const ex = list[counters[gp]%list.length]; counters[gp]++;
      items.push({name:p.place==="gym"?ex.g:ex.h,group:gp,dose:setsReps(p,gp),cue:ex.cue});
    });
    // abs finisher on every day (or full abs day)
    const absCount = type==="hiitAbs"?4:2;
    for(let k=0;k<absCount;k++){
      const list=LIB.abs; counters.abs=(counters.abs??0);
      const ex=list[counters.abs%list.length]; counters.abs++;
      items.push({name:p.place==="gym"?ex.g:ex.h,group:"abs",dose:setsReps(p,"abs"),cue:ex.cue});
    }
    // HIIT: always on HIIT days; added as finisher for fat-loss goal or general fitness
    const addHiit = type==="hiitAbs" || p.goal==="lose" || (p.goal==="fit" && i%2===0);
    if(addHiit){
      const h=hiitBlock(p);
      const picks = [0,1,2,3].map(k=>LIB.hiit[(i+k)%LIB.hiit.length]);
      picks.forEach(ex=>items.push({name:p.place==="gym"?ex.g:ex.h,group:"hiit",dose:`${h.rounds} rounds · ${h.work}s on / ${h.rest}s off`,cue:"Go hard in the work time, breathe in the rest."}));
    }
    plan[d]={type,title:t.name,items};
  });
  return plan;
}

/* ---------- Helpers ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function todayKey(){return DAYS[(new Date().getDay()+6)%7]}
function dateStr(d=new Date()){return d.toISOString().slice(0,10)}
/* How-to videos: add a link per exercise name when the videos are made.
   Until then the app shows "Video coming soon" plus a free YouTube search link. */
const VIDEOS = {
  // "Push-ups": "https://…/push-ups.mp4",
};
function videoUrl(name){return "https://www.youtube.com/results?search_query="+encodeURIComponent(name+" proper form tutorial")}
function videoHtml(name){
  if(VIDEOS[name]) return `<a class="vid" href="${VIDEOS[name]}" target="_blank" rel="noopener">▶ Watch how to do it</a>`;
  return `<span class="soon">🎬 Video coming soon</span> <a class="vid sm" href="${videoUrl(name)}" target="_blank" rel="noopener">or find it on YouTube</a>`;
}
function groupLabel(g){return{quads:"legs",hamstrings:"hamstrings",glutes:"glutes",calves:"calves",hiit:"HIIT",abs:"abs"}[g]||g}
function getLog(){return S.get("log",{})}            // { "2026-11-23": {Mon:[true,false,...]} }
function streak(){
  const log=getLog(); let n=0; const d=new Date();
  for(let i=0;i<60;i++){
    const k=dateStr(d), wd=DAYS[(d.getDay()+6)%7];
    if(profile.days.includes(wd)){
      const done = log[k] && log[k].every(Boolean) && log[k].length;
      if(done) n++; else if(i>0) break;   // today not finished yet doesn't break streak
    }
    d.setDate(d.getDate()-1);
  }
  return n;
}
const QUOTES=["You don't have to be extreme, just consistent.","One workout at a time. Today counts.","The trainer is in your pocket. Just follow the list.","Small steps every week beat one big week.","Sweat now, smile later.","Discipline is choosing what you want most over what you want now."];

/* ---------- Onboarding ---------- */
function renderOnboarding(edit){
  $("#nav").classList.add("hide");
  const p = edit?profile:{sex:"male",age:"",heightCm:"",weightKg:"",goal:"lose",level:"beginner",place:"gym",days:["Mon","Wed","Fri"],minutes:45,asian:true,name:""};
  $("#app").innerHTML = `
    <h1>💪 RozFit</h1>
    <p class="mut">Your free personal trainer. Answer a few questions and get a full weekly gym plan, a daily checklist, and diet help.</p>
    <div class="card">
      <label>Your name</label><input id="f_name" value="${esc(p.name||"")}" placeholder="e.g. Ali">
      <label>Sex</label>
      <div class="chips" data-f="sex">${["male","female"].map(v=>`<span class="chip ${p.sex===v?"on":""}" data-v="${v}">${v==="male"?"Male":"Female"}</span>`).join("")}</div>
      <div class="row">
        <div><label>Age</label><input id="f_age" type="number" inputmode="numeric" value="${p.age}" placeholder="28"></div>
        <div><label>Weight (kg)</label><input id="f_w" type="number" inputmode="decimal" value="${p.weightKg}" placeholder="80"></div>
      </div>
      <label>Height</label>
      <div class="row">
        <div><input id="f_ft" type="number" inputmode="numeric" placeholder="feet (5)" value="${p.heightCm?Math.floor(p.heightCm/30.48):""}"></div>
        <div><input id="f_in" type="number" inputmode="numeric" placeholder="inches (8)" value="${p.heightCm?Math.round((p.heightCm/2.54)%12):""}"></div>
      </div>
      <p class="mut">Or in cm: <input id="f_cm" type="number" inputmode="numeric" style="width:110px;display:inline-block;padding:6px" value="${p.heightCm||""}"></p>
    </div>
    <div class="card">
      <label>Main goal</label>
      <div class="chips" data-f="goal">${[["lose","🔥 Lose weight"],["muscle","💪 Build muscle"],["fit","🏃 Get fit & strong"]].map(([v,t])=>`<span class="chip ${p.goal===v?"on":""}" data-v="${v}">${t}</span>`).join("")}</div>
      <label>Experience</label>
      <div class="chips" data-f="level">${[["beginner","New to gym"],["intermediate","6+ months"],["advanced","2+ years"]].map(([v,t])=>`<span class="chip ${p.level===v?"on":""}" data-v="${v}">${t}</span>`).join("")}</div>
      <label>Where do you train?</label>
      <div class="chips" data-f="place">${[["gym","🏋️ Gym"],["home","🏠 Home, no equipment"]].map(([v,t])=>`<span class="chip ${p.place===v?"on":""}" data-v="${v}">${t}</span>`).join("")}</div>
    </div>
    <div class="card">
      <label>Which days can you train?</label>
      <div class="chips" data-f="days" data-multi="1">${DAYS.map(d=>`<span class="chip ${p.days.includes(d)?"on":""}" data-v="${d}">${d}</span>`).join("")}</div>
      <label>Time per workout</label>
      <div class="chips" data-f="minutes">${[30,45,60,75].map(m=>`<span class="chip ${p.minutes==m?"on":""}" data-v="${m}">${m} min</span>`).join("")}</div>
      <label><input id="f_asian" type="checkbox" style="width:auto" ${p.asian?"checked":""}> Use South Asian BMI ranges (recommended for Pakistan, India, Bangladesh)</label>
    </div>
    <p id="err" class="warn"></p>
    <button class="btn" id="go">${edit?"Save & rebuild my plan":"Build my plan →"}</button>
    ${edit?`<button class="btn sec" id="cancel">Cancel</button>`:""}
    <p class="mut" style="margin-top:14px">This app gives general fitness guidance, not medical advice. If you have a heart condition, injury, are pregnant or take medicine, check with a doctor first.</p>`;

  const state = JSON.parse(JSON.stringify(p));
  document.querySelectorAll(".chips").forEach(box=>{
    box.addEventListener("click",e=>{
      const c=e.target.closest(".chip"); if(!c)return;
      const f=box.dataset.f, v=c.dataset.v;
      if(box.dataset.multi){
        state.days = state.days.includes(v)?state.days.filter(x=>x!==v):[...state.days,v];
        c.classList.toggle("on");
      }else{
        box.querySelectorAll(".chip").forEach(x=>x.classList.remove("on")); c.classList.add("on");
        state[f] = f==="minutes"?+v:v;
      }
    });
  });
  const syncCm=()=>{const ft=+$("#f_ft").value||0,inch=+$("#f_in").value||0;if(ft)$("#f_cm").value=Math.round(ft*30.48+inch*2.54)};
  $("#f_ft").oninput=syncCm; $("#f_in").oninput=syncCm;
  if(edit)$("#cancel").onclick=()=>{render()};
  $("#go").onclick=()=>{
    state.name=$("#f_name").value.trim();
    state.age=+$("#f_age").value; state.weightKg=+$("#f_w").value; state.heightCm=+$("#f_cm").value;
    state.asian=$("#f_asian").checked;
    const e=[];
    if(!(state.age>=13&&state.age<=90))e.push("age (13–90)");
    if(!(state.weightKg>=30&&state.weightKg<=250))e.push("weight in kg");
    if(!(state.heightCm>=120&&state.heightCm<=230))e.push("height");
    if(!state.days.length)e.push("at least one training day");
    if(e.length){$("#err").textContent="Please fill in: "+e.join(", ");return}
    profile=state; S.set("profile",profile); S.set("plan",buildPlan(profile));
    tab="today"; viewDay=null; render();
  };
}

/* ---------- Today / Day view ---------- */
function renderDay(dayKey){
  const plan=S.get("plan",{}); const d=plan[dayKey];
  const isToday = dayKey===todayKey();
  const qi = new Date().getDate()%QUOTES.length;
  let html = "";
  if(!viewDay){
    html += `<div class="card banner"><h3>Assalam-o-Alaikum${profile.name?", "+esc(profile.name):""} 👋</h3>
      <p>${QUOTES[qi]}</p><p class="mut">🔥 Streak: <b>${streak()}</b> workout${streak()===1?"":"s"} in a row</p></div>`;
  }else{
    html += `<button class="btn sec" id="back" style="margin-top:0">← Back to week</button>`;
  }
  if(!d){
    const next = DAYS.slice(DAYS.indexOf(dayKey)+1).concat(DAYS).find(x=>plan[x]);
    html += `<div class="card"><h2 style="margin-top:0">😴 ${DAY_FULL[dayKey]} is a rest day</h2>
      <p>Rest is when your muscles grow. Try a 20–30 minute walk and drink plenty of water.</p>
      ${next?`<p class="mut">Next workout: <b>${DAY_FULL[next]}</b> – ${plan[next].title}</p>`:""}</div>`;
    $("#app").innerHTML=html; bindBack(); return;
  }
  const key = dateStr();
  const log = getLog();
  const checks = (isToday&&log[key])?log[key]:Array(d.items.length).fill(false);
  const done = checks.filter(Boolean).length;
  html += `<h1>${DAY_FULL[dayKey]}: ${d.title}</h1>
    <p class="mut">${d.items.length} exercises · about ${profile.minutes} min · rest 60–90 sec between sets</p>
    ${isToday?`<div class="bar" style="margin:10px 0"><i id="pbar" style="width:${done/d.items.length*100}%"></i></div>
    <p class="mut" id="ptxt">${done} of ${d.items.length} done</p>`:`<p class="mut">You can tick these off on ${DAY_FULL[dayKey]}.</p>`}
    <div class="card"><p class="mut" style="margin-top:0">🔥 Warm-up first: 5 min brisk walk or cycle, then 10 arm circles and 10 bodyweight squats.</p>`;
  let lastGroup=null;
  d.items.forEach((x,i)=>{
    if(x.group==="hiit"&&lastGroup!=="hiit") html+=`<h3 style="margin-top:14px">⚡ HIIT finisher</h3>`;
    if(x.group==="abs"&&lastGroup!=="abs") html+=`<h3 style="margin-top:14px">🎯 Abs</h3>`;
    lastGroup=x.group;
    html += `<div class="ex ${checks[i]?"done":""}">
      <input type="checkbox" data-i="${i}" ${checks[i]?"checked":""} ${isToday?"":"disabled"}>
      <div><div class="nm">${esc(x.name)}</div>
        <span class="tag">${groupLabel(x.group)}</span><span class="tag">${esc(x.dose)}</span>
        ${x.cue?`<p class="mut">${esc(x.cue)}</p>`:""}
        ${videoHtml(x.name)}
      </div></div>`;
  });
  html += `<p class="mut" style="margin-top:12px">🧊 Cool-down: 5 min easy walk + stretch the muscles you trained.</p></div>`;
  if(isToday) html += `<div class="card"><h3>⏱ Rest timer</h3><div class="timer" id="tm">0:00</div>
      <div class="row"><button class="btn sec" data-t="60">60s</button><button class="btn sec" data-t="90">90s</button><button class="btn sec" data-t="120">2 min</button></div></div>
      <div class="card hide" id="congrats" style="text-align:center"><div class="big">🎉</div><h2>Workout complete!</h2><p>Great job. See you next session.</p></div>`;
  $("#app").innerHTML=html; bindBack();
  if(!isToday)return;
  document.querySelectorAll(".ex input").forEach(cb=>cb.onchange=()=>{
    const l=getLog(); l[key]=l[key]&&l[key].length===d.items.length?l[key]:Array(d.items.length).fill(false);
    l[key][+cb.dataset.i]=cb.checked; S.set("log",l);
    cb.closest(".ex").classList.toggle("done",cb.checked);
    const n=l[key].filter(Boolean).length;
    $("#pbar").style.width=(n/d.items.length*100)+"%"; $("#ptxt").textContent=`${n} of ${d.items.length} done`;
    $("#congrats").classList.toggle("hide",n!==d.items.length);
    if(n===d.items.length && navigator.vibrate) navigator.vibrate([100,50,100]);
  });
  if(done===d.items.length)$("#congrats").classList.remove("hide");
  let timer=null;
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
    clearInterval(timer); let s=+b.dataset.t; const show=()=>$("#tm").textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; show();
    timer=setInterval(()=>{s--;show();if(s<=0){clearInterval(timer);$("#tm").textContent="Go! 💥";navigator.vibrate&&navigator.vibrate(400)}},1000);
  });
}
function bindBack(){const b=$("#back");if(b)b.onclick=()=>{viewDay=null;tab="week";render()}}

/* ---------- Week ---------- */
function renderWeek(){
  const plan=S.get("plan",{}); const t=todayKey();
  let html=`<h1>📅 Your week</h1><p class="mut">${profile.days.length} training days · ${profile.place==="gym"?"gym":"home"} · ${profile.minutes} min. Tap a day to see it.</p>`;
  DAYS.forEach(d=>{
    const p=plan[d];
    html+=`<div class="card day ${d===t?"today":""}" data-d="${d}">
      <div><h3>${DAY_FULL[d]}${d===t?" · today":""}</h3><p class="mut">${p?p.title+" · "+p.items.length+" exercises":"Rest / light walk"}</p></div>
      <span>${p?"💪":"😴"}</span></div>`;
  });
  html+=`<button class="btn sec" id="chg">Change my days or goal</button>`;
  $("#app").innerHTML=html;
  document.querySelectorAll(".day").forEach(c=>c.onclick=()=>{viewDay=c.dataset.d;tab="day";render()});
  $("#chg").onclick=()=>renderOnboarding(true);
}

/* ---------- Diet ---------- */
function renderDiet(){
  const c=calories(profile); const goalTxt={lose:"to lose about 0.5 kg a week",muscle:"to build muscle with little fat gain",fit:"to stay at your weight"}[profile.goal];
  $("#app").innerHTML=`
    <h1>🥗 Diet help</h1>
    <div class="stat">
      <div class="card"><div class="mut">Eat per day</div><div class="big">${c.target}</div><div class="mut">calories ${goalTxt}</div></div>
      <div class="card"><div class="mut">Protein</div><div class="big">${c.protein}g</div><div class="mut">per day</div></div>
    </div>
    <div class="card"><p>Water: about <b>${c.water} litres</b> a day (more in summer or on gym days).</p>
      <p class="mut">Your body burns about ${c.tdee} calories a day. Numbers are estimates — check your weight once a week and adjust.</p></div>
    ${profile.goal==="lose"?`<div class="card"><h3>🔥 10 simple rules for losing weight</h3><ul>
      <li>1 roti instead of 2, or swap naan / paratha for chapati.</li>
      <li>Fill half the plate with salad or sabzi first.</li>
      <li>Cook salan in 1–2 tbsp oil, not a full ladle. Skim the oil on top.</li>
      <li>Protein in every meal: eggs, chicken, daal, chana, yogurt, fish.</li>
      <li>No sugary drinks: swap cold drinks and sweet lassi for water, lemon water or plain lassi.</li>
      <li>Chai with less sugar, then no sugar after 2 weeks.</li>
      <li>Grilled tikka / boti over fried, karahi or biryani when eating out.</li>
      <li>Fruit instead of mithai; keep mithai for one day a week.</li>
      <li>Walk 8,000+ steps a day — it burns more than you think.</li>
      <li>Stop eating 2–3 hours before sleeping.</li></ul></div>`:""}
    <div class="card"><h3>🍽 Sample day (${profile.goal==="muscle"?"muscle gain":profile.goal==="lose"?"weight loss":"maintain"})</h3>
      <table>
        <tr><td><b>Breakfast</b></td><td>${profile.goal==="muscle"?"3 eggs omelette + 2 whole-wheat roti / toast + 1 banana":"2 boiled eggs + 1 whole-wheat roti or oats + green tea"}</td></tr>
        <tr><td><b>Lunch</b></td><td>${profile.goal==="muscle"?"Chicken salan + 1.5 cups rice + daal + salad":"Chicken / daal with 1 chapati + big salad + raita"}</td></tr>
        <tr><td><b>Snack</b></td><td>${profile.goal==="muscle"?"Milk or yogurt + handful of nuts + fruit":"1 fruit + plain yogurt, or roasted chana"}</td></tr>
        <tr><td><b>Dinner</b></td><td>${profile.goal==="muscle"?"Grilled fish / chicken + 2 roti + sabzi":"Grilled chicken or fish + sabzi (no roti, or 1 small)"}</td></tr>
      </table>
      <p class="mut">Vegetarian? Use daal, chana, paneer, yogurt and soya chunks for protein.</p></div>
    <p class="mut">General guidance only. If you have diabetes, blood pressure or kidney issues, talk to a doctor or dietitian before changing your diet.</p>`;
}

/* ---------- Me / BMI ---------- */
function renderMe(){
  const b=bmi(profile), [cat,cls]=bmiCat(b,profile.asian), [lo,hi]=healthyRange(profile);
  const col={ok:"var(--acc)",warn:"var(--warn)",bad:"var(--bad)"}[cls];
  const pos=Math.min(100,Math.max(0,(b-15)/(40-15)*100));
  const log=getLog(); const total=Object.values(log).filter(a=>a.length&&a.every(Boolean)).length;
  $("#app").innerHTML=`
    <h1>👤 ${esc(profile.name||"Me")}</h1>
    <div class="card"><div class="mut">Your BMI</div><div class="big" style="color:${col}">${b.toFixed(1)}</div>
      <p><b style="color:${col}">${cat}</b> ${profile.asian?"(South Asian ranges)":"(WHO ranges)"}</p>
      <div class="bar" style="position:relative;background:linear-gradient(90deg,#f59e0b 0 14%,#22c55e 14% ${profile.asian?32:40}%,#f59e0b ${profile.asian?32:40}% ${profile.asian?50:60}%,#ef4444 ${profile.asian?50:60}%)">
        <span style="position:absolute;left:calc(${pos}% - 2px);top:-4px;width:4px;height:16px;background:#fff;border-radius:2px"></span></div>
      <p class="mut">Healthy weight for your height: <b>${lo}–${hi} kg</b>. You are ${profile.weightKg} kg, ${profile.heightCm} cm, ${profile.age} years.</p>
      <p class="mut">BMI doesn't know about muscle. If you lift a lot, a waist under half your height is a better check.</p></div>
    <div class="stat"><div class="card"><div class="mut">Workouts finished</div><div class="big">${total}</div></div>
      <div class="card"><div class="mut">Current streak</div><div class="big">${streak()}</div></div></div>
    <div class="card"><label>Update today's weight (kg)</label><div class="row"><input id="nw" type="number" inputmode="decimal" value="${profile.weightKg}"><button class="btn" id="sw" style="margin:0;flex:0 0 90px">Save</button></div></div>
    <button class="btn sec" id="ed">Edit my details & plan</button>
    <button class="btn sec" id="rs" style="color:var(--bad)">Start over (clears everything)</button>`;
  $("#ed").onclick=()=>renderOnboarding(true);
  $("#sw").onclick=()=>{const w=+$("#nw").value;if(w>=30&&w<=250){profile.weightKg=w;S.set("profile",profile);const h=S.get("weights",[]);h.push([dateStr(),w]);S.set("weights",h);renderMe()}};
  $("#rs").onclick=()=>{const b=$("#rs");if(b.dataset.sure){try{["profile","plan","log","weights"].forEach(k=>localStorage.removeItem("rozfit_"+k))}catch(e){}profile=null;render()}else{b.dataset.sure=1;b.textContent="Tap again to clear everything"}};
}

/* ---------- Router ---------- */
function render(){
  if(!profile){renderOnboarding(false);return}
  $("#nav").classList.remove("hide");
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===(tab==="day"?"week":tab)));
  if(tab==="today"){viewDay=null;renderDay(todayKey())}
  else if(tab==="day")renderDay(viewDay);
  else if(tab==="week")renderWeek();
  else if(tab==="diet")renderDiet();
  else renderMe();
  window.scrollTo(0,0);
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;viewDay=null;render()});
render();
/* Offline + "install app" support (works once hosted on https) */
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}}
</script>
</body>
</html>
