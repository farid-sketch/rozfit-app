<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>RozFit – your daily gym plan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{--bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#e2e8f0;--mut:#94a3b8;--acc:#22c55e;--acc2:#16a34a;--warn:#f59e0b;--bad:#ef4444;--blue:#38bdf8}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{max-width:560px;margin:0 auto;padding:16px 16px 96px}
  h1{font-size:24px;margin:8px 0 4px} h2{font-size:19px;margin:18px 0 8px} h3{font-size:16px;margin:0 0 6px}
  p{margin:6px 0} .mut{color:var(--mut);font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
  label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
  input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0b1222;color:var(--txt);font-size:16px}
  .row{display:flex;gap:10px} .row>*{flex:1}
  .btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#04210f;font-weight:700;font-size:16px;margin-top:16px;cursor:pointer}
  .btn.sec{background:transparent;color:var(--txt);border:1px solid var(--line)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:#0b1222;color:var(--txt);cursor:pointer;font-size:15px;user-select:none}
  .chip.on{background:var(--acc);color:#04210f;border-color:var(--acc);font-weight:700}
  nav{position:fixed;bottom:0;left:0;right:0;background:#0b1222;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
  nav div{display:flex;max-width:560px;width:100%}
  nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0 12px;font-size:12px;cursor:pointer}
  nav button b{display:block;font-size:20px;margin-bottom:2px}
  nav button.on{color:var(--acc)}
  .ex{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
  .ex:first-of-type{border-top:0}
  .ex input[type=checkbox]{width:28px;height:28px;flex:none;accent-color:var(--acc);margin-top:2px}
  .ex.done .nm{text-decoration:line-through;color:var(--mut)}
  .nm{font-weight:600} .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:#0b1222;border:1px solid var(--line);color:var(--mut);margin-right:4px}
  .vid{display:inline-block;margin-top:6px;font-size:14px;color:var(--blue);text-decoration:none}
  .vid.sm{font-size:13px;color:var(--mut);text-decoration:underline}
  .soon{display:inline-block;margin-top:6px;font-size:13px;padding:3px 10px;border-radius:999px;background:#0b1222;border:1px dashed var(--line);color:var(--mut)}
  .bar{height:10px;background:#0b1222;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
  .big{font-size:34px;font-weight:800}
  .stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat .card{margin:0;text-align:center}
  .day{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
  .today{border-color:var(--acc)}
  .hide{display:none}
  .banner{background:linear-gradient(135deg,#14532d,#0f172a);border-color:#166534}
  .timer{font-size:28px;font-weight:800;text-align:center}
  ul{padding-left:20px;margin:6px 0} li{margin:4px 0}
  .warn{color:var(--warn)}

  .tick{flex:none;width:44px;height:44px;border-radius:50%;border:3px solid var(--acc);background:transparent;color:#04210f;font-size:26px;font-weight:900;cursor:pointer;line-height:1;margin-top:2px}
  .ex.done .tick{background:var(--acc)}
  .ex.done{opacity:.75}
  .vbox{position:relative;margin-top:8px;border-radius:12px;overflow:hidden;cursor:pointer;aspect-ratio:16/9;background:#000;max-width:100%}
  .vbox img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
  .vbox .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:rgba(239,68,68,.95);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;padding-left:4px}
  .vbox .vlab{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.7);color:#fff;font-size:13px;padding:3px 8px;border-radius:6px}
  .vframe{position:relative;margin-top:8px;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:#000}
  .vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .big-start{font-size:18px;padding:16px}
  .guide{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
  .gin{max-width:560px;margin:0 auto}
  .gtop{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:14px;margin-bottom:8px;padding-top:env(safe-area-inset-top)}
  .gx{background:none;border:1px solid var(--line);color:var(--txt);border-radius:10px;width:44px;height:44px;font-size:18px;cursor:pointer}
  .btn.huge{font-size:20px;padding:20px}
  .tag.big{font-size:15px;color:var(--txt);border-color:var(--acc)}
  .huge-t{font-size:64px;margin:10px 0}
  .btn:disabled{opacity:.4}

  .cgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}
  .cd{aspect-ratio:1;border-radius:12px;background:#0b1222;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mut)}
  .cd.ok{background:var(--acc);border-color:var(--acc);color:#04210f;font-size:20px}
  .cd.miss{border-color:#7f1d1d;color:#f87171}
  .cd.cur{outline:3px solid var(--blue);outline-offset:1px;color:var(--txt)}
  .cd.ms:not(.ok){border-style:dashed;border-color:var(--warn)}
  .badges{display:flex;flex-wrap:wrap;gap:8px}
  .badge{padding:8px 12px;border-radius:999px;border:1px solid var(--line);color:var(--mut);font-size:14px}
  .badge.on{background:#422006;border-color:var(--warn);color:#fde68a;font-weight:700}
  .shimg{width:100%;max-width:340px;border-radius:16px;margin:8px auto;display:block;box-shadow:0 10px 40px rgba(0,0,0,.5);-webkit-touch-callout:default}
  nav button{font-size:11px}

  .demo{position:relative;margin-top:8px;border-radius:12px;overflow:hidden;aspect-ratio:3/2;background:#fff}
  .demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .demo .d2{animation:rep 2.4s infinite}
  @keyframes rep{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.demo .d2{animation-duration:4s}}
  .demo .loop{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:3px 8px;border-radius:6px;max-width:85%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bigd{aspect-ratio:3/2;margin-top:4px}
  .tut{display:inline-block;margin-top:8px;background:none;border:1px solid var(--line);color:var(--blue);border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer}
  table{width:100%;border-collapse:collapse;font-size:14px} td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav" class="hide"><div>
  <button data-tab="today"><b>✅</b>Today</button>
  <button data-tab="week"><b>📅</b>Week</button>
  <button data-tab="challenge"><b>🏆</b>30 days</button>
  <button data-tab="diet"><b>🥗</b>Diet</button>
  <button data-tab="me"><b>👤</b>Me</button>
</div></nav>

<script>
/* =========================================================
   RozFit prototype — everything runs in the browser.
   Data is saved on the phone only (localStorage). No account, no server.
   ========================================================= */

const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DAY_FULL = {Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday",Fri:"Friday",Sat:"Saturday",Sun:"Sunday"};

/* ---------- Exercise library ----------
   g = gym version, h = home / no-equipment version
   cue = one-line form tip shown under the exercise */
const LIB = {
  chest:[
    {g:"Barbell bench press",h:"Push-ups",cue:"Shoulder blades squeezed, lower slowly to chest."},
    {g:"Incline dumbbell press",h:"Feet-elevated push-ups",cue:"Elbows at about 45°, not flared out."},
    {g:"Cable chest fly",h:"Wide push-ups",cue:"Slight bend in elbows, squeeze at the middle."}],
  back:[
    {g:"Lat pulldown",h:"Towel door rows",cue:"Pull elbows down to your ribs, chest up."},
    {g:"Seated cable row",h:"Superman hold",cue:"Keep back straight, pull to belly button."},
    {g:"Dumbbell one-arm row",h:"Reverse snow angels",cue:"Pull the weight towards your hip."}],
  shoulders:[
    {g:"Seated dumbbell shoulder press",h:"Pike push-ups",cue:"Press straight up, don't arch your lower back."},
    {g:"Dumbbell lateral raise",h:"Arm circles (slow)",cue:"Lift to shoulder height, lead with elbows."},
    {g:"Face pull",h:"Prone Y-T raises",cue:"Pull rope to your forehead, elbows high."}],
  biceps:[
    {g:"Dumbbell biceps curl",h:"Backpack curls",cue:"Elbows stay by your sides, no swinging."},
    {g:"Hammer curl",h:"Towel isometric curl",cue:"Thumbs up, slow on the way down."}],
  triceps:[
    {g:"Cable triceps pushdown",h:"Bench / chair dips",cue:"Elbows pinned, straighten arms fully."},
    {g:"Overhead dumbbell triceps extension",h:"Diamond push-ups",cue:"Keep elbows pointing forward."}],
  quads:[
    {g:"Barbell back squat",h:"Bodyweight squats",cue:"Chest up, knees follow toes, hips below knees if you can."},
    {g:"Leg press",h:"Reverse lunges",cue:"Push through the whole foot, don't lock knees."},
    {g:"Leg extension",h:"Wall sit",cue:"Pause at the top, lower slowly."}],
  hamstrings:[
    {g:"Romanian deadlift",h:"Single-leg hip hinge",cue:"Push hips back, bar close to legs, flat back."},
    {g:"Lying leg curl",h:"Glute bridge",cue:"Squeeze at the top, slow on the way down."}],
  glutes:[
    {g:"Barbell hip thrust",h:"Single-leg glute bridge",cue:"Chin tucked, squeeze glutes hard at the top."},
    {g:"Walking lunges",h:"Step-ups on a stair",cue:"Long steps, front knee over the ankle."}],
  calves:[
    {g:"Standing calf raise",h:"Stair calf raises",cue:"Full stretch at bottom, pause at the top."}],
  abs:[
    {g:"Plank",h:"Plank",cue:"Straight line head to heels, squeeze glutes.",time:true},
    {g:"Hanging knee raise",h:"Lying leg raise",cue:"Lower back pressed down, no swinging."},
    {g:"Cable crunch",h:"Crunches",cue:"Curl ribs towards hips, don't pull your neck."},
    {g:"Russian twist",h:"Russian twist",cue:"Rotate from the chest, feet down if it hurts."},
    {g:"Bicycle crunch",h:"Bicycle crunch",cue:"Slow and controlled, elbow towards opposite knee."},
    {g:"Mountain climbers",h:"Mountain climbers",cue:"Hips low, drive knees fast.",time:true}],
  hiit:[
    {g:"Jumping jacks",h:"Jumping jacks"},
    {g:"Burpees",h:"Burpees"},
    {g:"High knees",h:"High knees"},
    {g:"Squat jumps",h:"Squat jumps"},
    {g:"Skater hops",h:"Skater hops"},
    {g:"Rowing machine sprint",h:"Fast feet shuffle"}],
};

/* Which muscle groups each type of day trains */
const DAY_TYPES = {
  full:  {name:"Full body",  groups:["quads","chest","back","shoulders","hamstrings","abs"]},
  fullB: {name:"Full body B",groups:["glutes","chest","back","shoulders","biceps","triceps"]},
  upper: {name:"Upper body", groups:["chest","back","shoulders","biceps","triceps"]},
  lower: {name:"Lower body", groups:["quads","hamstrings","glutes","calves"]},
  push:  {name:"Push (chest, shoulders, triceps)",groups:["chest","chest","shoulders","shoulders","triceps"]},
  pull:  {name:"Pull (back, biceps)",groups:["back","back","back","biceps","biceps"]},
  legs:  {name:"Legs",groups:["quads","quads","hamstrings","glutes","calves"]},
  hiitAbs:{name:"HIIT + Abs",groups:[]},
};

/* Split chosen by number of days the person can train */
const SPLITS = {
  1:["full"],
  2:["full","fullB"],
  3:["full","fullB","full"],
  4:["upper","lower","upper","lower"],
  5:["push","pull","legs","upper","lower"],
  6:["push","pull","legs","push","pull","legs"],
  7:["push","pull","legs","hiitAbs","upper","lower","hiitAbs"],
};

/* ---------- Storage ---------- */
const S = {
  get(k,d){try{return JSON.parse(localStorage.getItem("rozfit_"+k))??d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("rozfit_"+k,JSON.stringify(v))}catch(e){}},
};
let profile = S.get("profile",null);
let tab = "today";
let viewDay = null; // when user taps a day in Week view

/* ---------- Maths ---------- */
function bmi(p){const m=p.heightCm/100;return p.weightKg/(m*m)}
function bmiCat(b,asian){
  // WHO cut-offs; South Asian cut-offs (WHO Asia expert consultation 2004) are lower.
  if(asian){ if(b<18.5)return["Underweight","warn"]; if(b<23)return["Healthy","ok"]; if(b<27.5)return["Overweight","warn"]; return["Obese","bad"]; }
  if(b<18.5)return["Underweight","warn"]; if(b<25)return["Healthy","ok"]; if(b<30)return["Overweight","warn"]; return["Obese","bad"];
}
function healthyRange(p){const m=p.heightCm/100;const hi=p.asian?22.9:24.9;return[(18.5*m*m).toFixed(0),(hi*m*m).toFixed(0)]}
function bmr(p){ // Mifflin-St Jeor
  const base=10*p.weightKg+6.25*p.heightCm-5*p.age; return p.sex==="male"?base+5:base-161;
}
function calories(p){
  const act = 1.2 + 0.075*p.days.length; // rough: sedentary + training days
  const tdee = bmr(p)*act;
  let target = tdee;
  if(p.goal==="lose") target = tdee-500;
  if(p.goal==="muscle") target = tdee+250;
  const floor = p.sex==="male"?1500:1200;
  target = Math.max(target,floor);
  const protein = Math.round(p.weightKg*(p.goal==="muscle"?1.8:p.goal==="lose"?1.6:1.4));
  return {tdee:Math.round(tdee),target:Math.round(target/10)*10,protein,water:(p.weightKg*0.033).toFixed(1)};
}

/* ---------- Plan generator ---------- */
function setsReps(p,group){
  if(group==="abs") return p.level==="beginner"?"2 × 12 (or 30 sec)":p.level==="advanced"?"4 × 15 (or 60 sec)":"3 × 15 (or 45 sec)";
  const sets = p.level==="beginner"?3:p.level==="advanced"?4:3;
  const reps = p.goal==="muscle"?"8–12":p.goal==="lose"?"12–15":"10–12";
  return `${sets} × ${reps}`;
}
function hiitBlock(p){
  const rounds = p.level==="beginner"?3:p.level==="advanced"?5:4;
  const work = p.level==="beginner"?20:p.level==="advanced"?40:30;
  return {rounds,work,rest:60-work};
}
function buildPlan(p){
  const split = SPLITS[p.days.length];
  const counters = {};               // rotate exercise variations across the week
  const plan = {};
  const sorted = DAYS.filter(d=>p.days.includes(d));
  sorted.forEach((d,i)=>{
    const type = split[i]; const t = DAY_TYPES[type];
    const items = [];
    const maxMain = p.minutes<=30?4:p.minutes<=45?5:6;
    t.groups.slice(0,maxMain).forEach(gp=>{
      const list = LIB[gp]; counters[gp]=(counters[gp]??(i%list.length));
      const ex = list[counters[gp]%list.length]; counters[gp]++;
      items.push({name:p.place==="gym"?ex.g:ex.h,group:gp,dose:setsReps(p,gp),cue:ex.cue});
    });
    // abs finisher on every day (or full abs day)
    const absCount = type==="hiitAbs"?4:2;
    for(let k=0;k<absCount;k++){
      const list=LIB.abs; counters.abs=(counters.abs??0);
      const ex=list[counters.abs%list.length]; counters.abs++;
      items.push({name:p.place==="gym"?ex.g:ex.h,group:"abs",dose:setsReps(p,"abs"),cue:ex.cue});
    }
    // HIIT: always on HIIT days; added as finisher for fat-loss goal or general fitness
    const addHiit = type==="hiitAbs" || p.goal==="lose" || (p.goal==="fit" && i%2===0);
    if(addHiit){
      const h=hiitBlock(p);
      const picks = [0,1,2,3].map(k=>LIB.hiit[(i+k)%LIB.hiit.length]);
      picks.forEach(ex=>items.push({name:p.place==="gym"?ex.g:ex.h,group:"hiit",dose:`${h.rounds} rounds · ${h.work}s on / ${h.rest}s off`,cue:"Go hard in the work time, breathe in the rest."}));
    }
    plan[d]={type,title:t.name,items};
  });
  return plan;
}

/* ---------- Helpers ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function todayKey(){return DAYS[(new Date().getDay()+6)%7]}
function dateStr(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
/* How-to videos: YouTube video ID per exercise (short form demos, embeddable).

/* Short looping demos: 2 photos (start + end of the rep) per exercise, from the public-domain
   Free Exercise DB (github.com/yuhonas/free-exercise-db, Unlicense). Stored in /demos. */
const DEMOS = {

function videoUrl(name){return "https://www.youtube.com/results?search_query="+encodeURIComponent(name+" proper form tutorial")}
function groupLabel(g){return{quads:"legs",hamstrings:"hamstrings",glutes:"glutes",calves:"calves",hiit:"HIIT",abs:"abs"}[g]||g}
function getLog(){return S.get("log",{})}            // { "2026-11-23": {Mon:[true,false,...]} }
function dayComplete(log,date){return Object.entries(log).some(([k,v])=>k.startsWith(date+"|")&&Array.isArray(v)&&v.length&&v.every(Boolean))}
function streak(){
  const log=getLog(); let n=0; const d=new Date();
  for(let i=0;i<60;i++){
    const k=dateStr(d), wd=DAYS[(d.getDay()+6)%7];
    if(dayComplete(log,k)) n++;
    else if(profile.days.includes(wd) && i>0) break;   // a missed training day breaks the streak; today unfinished doesn't
    d.setDate(d.getDate()-1);
  }
  return n;
}

/* ---------- Today / Day view ---------- */
/* Progress is saved per date AND workout, so any day's workout can be done today. */
function logKey(dayKey){return dateStr()+"|"+dayKey}
function getChecks(dayKey,n){const l=getLog();const c=l[logKey(dayKey)];return (c&&c.length===n)?c:Array(n).fill(false)}
function setChecks(dayKey,arr){const l=getLog();l[logKey(dayKey)]=arr;S.set("log",l)}

function demoHtml(name,big){
  const d=DEMOS[name]; if(!d) return "";
  return `<div class="demo ${big?"bigd":""}" aria-label="${esc(name)} demo"><img src="demos/${d[0]}" alt=""><img class="d2" src="demos/${d[1]}" alt=""><span class="loop">↻ ${esc(name)}</span></div>`;
}
function thumbHtml(name,i){
  const id=VIDEOS[name], demo=demoHtml(name,false);
  if(demo) return demo+(id?`<button class="tut" data-vid="${id}">▶ Full tutorial (YouTube)</button>`:"");
  if(!id) return `<a class="vid sm" href="${videoUrl(name)}" target="_blank" rel="noopener">▶ Find a video on YouTube</a>`;
  return `<div class="vbox" data-vid="${id}" data-i="${i}"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/${id}/hqdefault.jpg"><span class="play">▶</span><span class="vlab">Watch how to do it</span></div>`;
}
function playVideo(box){
  const id=box.dataset.vid;
  box.outerHTML=`<div class="vframe"><iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&playsinline=1&rel=0&modestbranding=1" title="How to do it" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`;
}
function bindVideos(root){root.querySelectorAll(".vbox,.tut").forEach(b=>b.onclick=()=>playVideo(b))}

function renderDay(dayKey){
  const plan=S.get("plan",{}); const d=plan[dayKey];
  const isToday = dayKey===todayKey();
  const qi = new Date().getDate()%QUOTES.length;
  let html = "";
  if(!viewDay){
    html += `<div class="card banner"><h3>Assalam-o-Alaikum${profile.name?", "+esc(profile.name):""} 👋</h3>
      <p>${QUOTES[qi]}</p><p class="mut">🔥 Streak: <b>${streak()}</b> workout${streak()===1?"":"s"} in a row</p></div>`;
  }else{
    html += `<button class="btn sec" id="back" style="margin-top:0">← Back to week</button>`;
  }
  if(!d){
    const others = DAYS.filter(x=>plan[x]);
    html += `<div class="card"><h2 style="margin-top:0">😴 ${DAY_FULL[dayKey]} is a rest day</h2>
      <p>Rest is when your muscles grow. A 20–30 minute walk is perfect today.</p>
      <h3 style="margin-top:14px">Want to train anyway? Pick a workout:</h3>
      ${others.map(x=>`<button class="btn sec pickday" data-d="${x}">${DAY_FULL[x]} – ${plan[x].title}</button>`).join("")}</div>`;
    $("#app").innerHTML=html; bindBack();
    document.querySelectorAll(".pickday").forEach(b=>b.onclick=()=>{viewDay=b.dataset.d;tab="day";render()});
    return;
  }
  const n=d.items.length;
  const checks = getChecks(dayKey,n);
  const done = checks.filter(Boolean).length;
  html += `<h1>${DAY_FULL[dayKey]}: ${d.title}</h1>
    <p class="mut">${n} exercises · about ${profile.minutes} min${isToday?"":" · you can do this one today"}</p>
    <button class="btn big-start" id="start">${done===0?"▶ Start workout":done===n?"✅ Workout done – do it again":"▶ Continue workout ("+done+"/"+n+")"}</button>
    <div class="bar" style="margin:12px 0 4px"><i id="pbar" style="width:${done/n*100}%"></i></div>
    <p class="mut" id="ptxt">${done} of ${n} done · tap the circle when you finish an exercise</p>
    <div class="card"><p class="mut" style="margin-top:0">🔥 Warm-up first: 5 min brisk walk or cycle, then 10 arm circles and 10 bodyweight squats.</p>`;
  let lastGroup=null;
  d.items.forEach((x,i)=>{
    if(x.group==="hiit"&&lastGroup!=="hiit") html+=`<h3 style="margin-top:14px">⚡ HIIT finisher</h3>`;
    if(x.group==="abs"&&lastGroup!=="abs") html+=`<h3 style="margin-top:14px">🎯 Abs</h3>`;
    lastGroup=x.group;
    html += `<div class="ex ${checks[i]?"done":""}" id="ex${i}">
      <button class="tick" data-i="${i}" aria-label="Mark ${esc(x.name)} done">${checks[i]?"✓":""}</button>
      <div style="flex:1;min-width:0"><div class="nm">${i+1}. ${esc(x.name)}</div>
        <span class="tag">${groupLabel(x.group)}</span><span class="tag">${esc(x.dose)}</span>
        ${x.cue?`<p class="mut">${esc(x.cue)}</p>`:""}
        ${thumbHtml(x.name,i)}
      </div></div>`;
  });
  html += `<p class="mut" style="margin-top:12px">🧊 Cool-down: 5 min easy walk + stretch the muscles you trained.</p></div>
    <div class="card hide" id="congrats" style="text-align:center"><div class="big">🎉</div><h2>Workout complete!</h2><p>Great job. See you next session.</p><button class="btn" id="lshare">📤 Share my progress</button></div>`;
  $("#app").innerHTML=html; bindBack(); bindVideos($("#app"));
  const refresh=()=>{
    const c=getChecks(dayKey,n), k=c.filter(Boolean).length;
    $("#pbar").style.width=(k/n*100)+"%"; $("#ptxt").textContent=`${k} of ${n} done · tap the circle when you finish an exercise`;
    $("#congrats").classList.toggle("hide",k!==n);
    $("#start").textContent=k===0?"▶ Start workout":k===n?"✅ Workout done – do it again":"▶ Continue workout ("+k+"/"+n+")";
  };
  document.querySelectorAll(".tick").forEach(b=>b.onclick=()=>{
    const c=getChecks(dayKey,n), i=+b.dataset.i; c[i]=!c[i]; setChecks(dayKey,c);
    b.textContent=c[i]?"✓":""; b.closest(".ex").classList.toggle("done",c[i]);
    if(c[i]&&navigator.vibrate)navigator.vibrate(60);
    refresh();
    if(c.every(Boolean))checkMilestone();
  });
  $("#start").onclick=()=>startGuided(dayKey);
  $("#lshare").onclick=()=>openShare("workout");
  refresh();
}
function bindBack(){const b=$("#back");if(b)b.onclick=()=>{viewDay=null;tab="week";render()}}

/* ---------- Guided workout: one exercise at a time ---------- */
let gTimer=null;
function startGuided(dayKey){
  const d=S.get("plan",{})[dayKey]; const n=d.items.length;
  let c=getChecks(dayKey,n); if(c.every(Boolean)){c=Array(n).fill(false);setChecks(dayKey,c)}
  let i=c.findIndex(x=>!x); if(i<0)i=0;
  const ov=document.createElement("div"); ov.className="guide"; document.body.appendChild(ov);
  document.body.style.overflow="hidden";
  const close=()=>{clearInterval(gTimer);ov.remove();document.body.style.overflow="";render()};
  const show=()=>{
    clearInterval(gTimer);
    const x=d.items[i], id=VIDEOS[x.name], k=getChecks(dayKey,n).filter(Boolean).length;
    ov.innerHTML=`<div class="gin">
      <div class="gtop"><button class="gx" id="gclose">✕</button><span>Exercise ${i+1} of ${n}</span><span>${k} done</span></div>
      <div class="bar"><i style="width:${k/n*100}%"></i></div>
      ${DEMOS[x.name]?demoHtml(x.name,true)+(id?`<button class="tut" data-vid="${id}">▶ Full tutorial (YouTube)</button>`:""):id?`<div class="vframe"><iframe src="https://www.youtube-nocookie.com/embed/${id}?playsinline=1&rel=0&modestbranding=1" title="How to do ${esc(x.name)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`:""}
      <h1>${esc(x.name)}</h1>
      <p><span class="tag">${groupLabel(x.group)}</span><span class="tag big">${esc(x.dose)}</span></p>
      ${x.cue?`<p>${esc(x.cue)}</p>`:""}
      <button class="btn huge" id="gdone">✓ Done – next exercise</button>
      <div class="row"><button class="btn sec" id="gprev" ${i===0?"disabled":""}>← Back</button><button class="btn sec" id="gskip">Skip →</button></div>
    </div>`;
    $("#gclose").onclick=close; bindVideos(ov);
    $("#gprev").onclick=()=>{if(i>0){i--;show()}};
    $("#gskip").onclick=()=>next(false);
    $("#gdone").onclick=()=>{const cc=getChecks(dayKey,n);cc[i]=true;setChecks(dayKey,cc);if(navigator.vibrate)navigator.vibrate(80);next(true)};
  };
  const next=(rest)=>{
    const cc=getChecks(dayKey,n);
    if(cc.every(Boolean)){finish();return}
    let j=cc.findIndex((v,ix)=>!v&&ix>i); if(j<0)j=cc.findIndex(v=>!v);
    if(!rest){i=j;show();return}
    restScreen(j);
  };
  const restScreen=(j)=>{
    let s=60; const nx=d.items[j];
    ov.innerHTML=`<div class="gin" style="text-align:center">
      <div class="gtop"><button class="gx" id="gclose">✕</button><span></span><span></span></div>
      <h2>Rest</h2><div class="timer huge-t" id="gt">1:00</div>
      <p class="mut">Drink some water. Next up:</p><h2>${esc(nx.name)}</h2>
      <button class="btn huge" id="gnext">Skip rest – start now</button>
      <div class="row"><button class="btn sec" id="g30">+30 sec</button></div></div>`;
    $("#gclose").onclick=close;
    const go=()=>{clearInterval(gTimer);i=j;show()};
    $("#gnext").onclick=go; $("#g30").onclick=()=>{s+=30};
    gTimer=setInterval(()=>{s--;const el=$("#gt");if(!el)return;el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;if(s<=0){if(navigator.vibrate)navigator.vibrate(400);go()}},1000);
  };
  const finish=()=>{
    ov.innerHTML=`<div class="gin" style="text-align:center;padding-top:60px"><div style="font-size:72px">🎉</div><h1>Workout complete!</h1>
      <p>Every exercise done. 🔥 Streak: <b>${streak()}</b></p><p class="mut">شاباش! آج کی ورزش مکمل</p>
      <button class="btn huge" id="gshare">📤 Share my progress</button><button class="btn sec" id="gend">Finish</button></div>`;
    $("#gshare").onclick=()=>{clearInterval(gTimer);ov.remove();document.body.style.overflow="";openShare("workout")};
    if(navigator.vibrate)navigator.vibrate([100,50,100]);
    $("#gend").onclick=()=>{close();checkMilestone()};
  };
  show();
}

    <div class="card"><h3>🍽 Sample day (${profile.goal==="muscle"?"muscle gain":profile.goal==="lose"?"weight loss":"maintain"})</h3>
      <table>
        <tr><td><b>Breakfast</b></td><td>${profile.goal==="muscle"?"3 eggs omelette + 2 whole-wheat roti / toast + 1 banana":"2 boiled eggs + 1 whole-wheat roti or oats + green tea"}</td></tr>
        <tr><td><b>Lunch</b></td><td>${profile.goal==="muscle"?"Chicken salan + 1.5 cups rice + daal + salad":"Chicken / daal with 1 chapati + big salad + raita"}</td></tr>
        <tr><td><b>Snack</b></td><td>${profile.goal==="muscle"?"Milk or yogurt + handful of nuts + fruit":"1 fruit + plain yogurt, or roasted chana"}</td></tr>
        <tr><td><b>Dinner</b></td><td>${profile.goal==="muscle"?"Grilled fish / chicken + 2 roti + sabzi":"Grilled chicken or fish + sabzi (no roti, or 1 small)"}</td></tr>
      </table>
      <p class="mut">Vegetarian? Use daal, chana, paneer, yogurt and soya chunks for protein.</p></div>
    <p class="mut">General guidance only. If you have diabetes, blood pressure or kidney issues, talk to a doctor or dietitian before changing your diet.</p>`;
}

/* ---------- Me / BMI ---------- */
function renderMe(){
  const b=bmi(profile), [cat,cls]=bmiCat(b,profile.asian), [lo,hi]=healthyRange(profile);
  const col={ok:"var(--acc)",warn:"var(--warn)",bad:"var(--bad)"}[cls];
  const pos=Math.min(100,Math.max(0,(b-15)/(40-15)*100));
  const log=getLog(); const total=Object.values(log).filter(a=>Array.isArray(a)&&a.length&&a.every(Boolean)).length;
  $("#app").innerHTML=`
    <h1>👤 ${esc(profile.name||"Me")}</h1>
    <div class="card"><div class="mut">Your BMI</div><div class="big" style="color:${col}">${b.toFixed(1)}</div>
      <p><b style="color:${col}">${cat}</b> ${profile.asian?"(South Asian ranges)":"(WHO ranges)"}</p>
      <div class="bar" style="position:relative;background:linear-gradient(90deg,#f59e0b 0 14%,#22c55e 14% ${profile.asian?32:40}%,#f59e0b ${profile.asian?32:40}% ${profile.asian?50:60}%,#ef4444 ${profile.asian?50:60}%)">
        <span style="position:absolute;left:calc(${pos}% - 2px);top:-4px;width:4px;height:16px;background:#fff;border-radius:2px"></span></div>
      <p class="mut">Healthy weight for your height: <b>${lo}–${hi} kg</b>. You are ${profile.weightKg} kg, ${profile.heightCm} cm, ${profile.age} years.</p>
      <p class="mut">BMI doesn't know about muscle. If you lift a lot, a waist under half your height is a better check.</p></div>
    <div class="stat"><div class="card"><div class="mut">Workouts finished</div><div class="big">${total}</div></div>
      <div class="card"><div class="mut">Current streak</div><div class="big">${streak()}</div></div></div>
    <div class="card"><label>Update today's weight (kg)</label><div class="row"><input id="nw" type="number" inputmode="decimal" value="${profile.weightKg}"><button class="btn" id="sw" style="margin:0;flex:0 0 90px">Save</button></div></div>
    <p class="mut">Started at ${startWeight()} kg${kgLost()>0?` · <b style="color:var(--acc)">${kgLost()} kg lost 🎉</b>`:""}</p>
    <button class="btn" id="shme">📤 Share my progress</button>
    <button class="btn sec" id="ed">Edit my details & plan</button>
    <button class="btn sec" id="rs" style="color:var(--bad)">Start over (clears everything)</button>
    <p class="mut" style="margin-top:16px;font-size:12px">Exercise demo photos: <a class="vid sm" href="https://github.com/yuhonas/free-exercise-db" target="_blank" rel="noopener">Free Exercise DB</a> (public domain). Full tutorials: YouTube creators.</p>`;
  $("#ed").onclick=()=>renderOnboarding(true);
  $("#shme").onclick=()=>openShare("workout");
  $("#sw").onclick=()=>{const w=+$("#nw").value;if(w>=30&&w<=250){profile.weightKg=w;S.set("profile",profile);const h=S.get("weights",[]);h.push([dateStr(),w]);S.set("weights",h);renderMe()}};
  $("#rs").onclick=()=>{const b=$("#rs");if(b.dataset.sure){try{["profile","plan","log","weights","challenge"].forEach(k=>localStorage.removeItem("rozfit_"+k))}catch(e){}profile=null;render()}else{b.dataset.sure=1;b.textContent="Tap again to clear everything"}};
}

/* ---------- Stats used by share card + challenge ---------- */
const APP_LINK = "farid-sketch.github.io/rozfit-app";
function totalWorkouts(){const l=getLog();return Object.values(l).filter(a=>Array.isArray(a)&&a.length&&a.every(Boolean)).length}
function startWeight(){
  if(profile.startWeight) return profile.startWeight;
  const h=S.get("weights",[]); return h.length?h[0][1]:profile.weightKg;
}
function kgLost(){return Math.max(0,Math.round((startWeight()-profile.weightKg)*10)/10)}

/* ---------- 30-day challenge (all stored on the phone) ---------- */
const CH_DAYS=30, MILESTONES=[7,14,21,30];
function getCh(){return S.get("challenge",null)}
function chDayIndex(ch,date=new Date()){const s=new Date(ch.start+"T00:00:00");const d=new Date(dateStr(date)+"T00:00:00");return Math.round((d-s)/864e5)} // 0-based
function chDayDone(ch,i){
  const d=new Date(ch.start+"T00:00:00"); d.setDate(d.getDate()+i); const k=dateStr(d);
  return dayComplete(getLog(),k) || !!(ch.active&&ch.active[k]);
}
function chStats(ch){
  const today=Math.min(chDayIndex(ch),CH_DAYS-1); let done=0;
  for(let i=0;i<=today;i++) if(chDayDone(ch,i)) done++;
  return {today, done, finished: chDayIndex(ch)>=CH_DAYS};
}
function renderChallenge(){
  const ch=getCh();
  if(!ch){
    $("#app").innerHTML=`
      <h1>🏆 30-day RozFit challenge</h1>
      <div class="card banner"><h3>30 دن کا چیلنج</h3>
        <p>Move every day for 30 days. Do your workout on gym days, and a 20-minute walk on rest days.</p>
        <p class="mut">ہر روز حرکت کریں: جم کے دن ورزش، آرام کے دن 20 منٹ واک۔</p></div>
      <div class="card"><ul>
        <li>✅ A day counts when you finish your workout, or tick "active rest" on a rest day</li>
        <li>🎖 Badges and a share card at day 7, 14, 21 and 30</li>
        <li>📤 Share on WhatsApp status or Instagram and challenge your friends</li></ul></div>
      <button class="btn huge" id="join">Join the challenge – start today</button>`;
    $("#join").onclick=()=>{S.set("challenge",{start:dateStr(),active:{},shown:[]});renderChallenge()};
    return;
  }
  const st=chStats(ch); const todayK=dateStr();
  const isRest=!profile.days.includes(todayKey());
  const todayDone=chDayDone(ch,st.today);
  let cells="";
  for(let i=0;i<CH_DAYS;i++){
    const past=i<st.today||(i===st.today&&st.finished), cur=i===st.today&&!st.finished, ok=i<=st.today&&chDayDone(ch,i);
    cells+=`<div class="cd ${ok?"ok":past?"miss":""} ${cur?"cur":""} ${MILESTONES.includes(i+1)?"ms":""}">${ok?"✓":i+1}</div>`;
  }
  const reached=MILESTONES.filter(m=>st.done>=m);
  $("#app").innerHTML=`
    <h1>🏆 30-day challenge</h1>
    <p class="mut">Started ${ch.start} · ${st.finished?"finished":"day "+(st.today+1)+" of 30"}</p>
    <div class="stat"><div class="card"><div class="mut">Days done</div><div class="big">${st.done}<span class="mut" style="font-size:18px">/30</span></div></div>
      <div class="card"><div class="mut">Next badge</div><div class="big">${(MILESTONES.find(m=>m>st.done)||"🏁")}</div><div class="mut">${MILESTONES.find(m=>m>st.done)?"days":"all done"}</div></div></div>
    <div class="bar" style="margin:10px 0"><i style="width:${st.done/CH_DAYS*100}%"></i></div>
    <div class="cgrid">${cells}</div>
    ${st.finished?"":todayDone?`<div class="card" style="text-align:center"><b>✅ Today is done!</b><p class="mut">آج کا دن مکمل</p></div>`:
      isRest?`<button class="btn huge" id="act">✓ I did a 20-min walk today (active rest)</button>`:
      `<button class="btn huge" id="gotw">▶ Do today's workout</button>`}
    <div class="card"><h3>🎖 Badges</h3><div class="badges">${MILESTONES.map(m=>`<span class="badge ${reached.includes(m)?"on":""}">${m===30?"🏆":"🎖"} ${m} days</span>`).join("")}</div></div>
    <button class="btn" id="shch">📤 Share my challenge progress</button>
    <button class="btn sec" id="quit">Restart challenge</button>`;
  const a=$("#act"); if(a)a.onclick=()=>{ch.active=ch.active||{};ch.active[todayK]=true;S.set("challenge",ch);renderChallenge();checkMilestone()};
  const g=$("#gotw"); if(g)g.onclick=()=>{tab="today";render()};
  $("#shch").onclick=()=>openShare("challenge");
  $("#quit").onclick=()=>{const b=$("#quit");if(b.dataset.sure){S.set("challenge",null);renderChallenge()}else{b.dataset.sure=1;b.textContent="Tap again to restart from day 1"}};
}
/* Show a milestone share card once, the first time a badge is reached */
function checkMilestone(){
  const ch=getCh(); if(!ch)return false;
  const st=chStats(ch); ch.shown=ch.shown||[];
  const m=MILESTONES.filter(x=>st.done>=x&&!ch.shown.includes(x)).pop();
  if(!m)return false;
  ch.shown.push(...MILESTONES.filter(x=>x<=m&&!ch.shown.includes(x))); S.set("challenge",ch);
  openShare("challenge",m); return true;
}

/* ---------- Share card (drawn on a canvas, 1080x1920 = story size) ---------- */
const URDU_FONT='"Noto Nastaliq Urdu","Jameel Noori Nastaleeq","Geeza Pro","Noto Naskh Arabic",Tahoma,sans-serif';
const EN_FONT='-apple-system,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif';
function drawCard(kind,milestone){
  const W=1080,H=1920,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,"#052e16");g.addColorStop(.55,"#0f172a");g.addColorStop(1,"#020617");
  x.fillStyle=g;x.fillRect(0,0,W,H);
  // soft glow
  const rg=x.createRadialGradient(W*.8,H*.15,10,W*.8,H*.15,700);rg.addColorStop(0,"rgba(34,197,94,.35)");rg.addColorStop(1,"rgba(34,197,94,0)");x.fillStyle=rg;x.fillRect(0,0,W,H);
  const T=(t,y,size,col="#e2e8f0",w=800,font=EN_FONT,align="center",rtl=false)=>{x.font=`${w} ${size}px ${font}`;x.fillStyle=col;x.textAlign=align;x.direction=rtl?"rtl":"ltr";x.fillText(t,align==="center"?W/2:align==="right"?W-90:90,y);x.direction="ltr"};
  // brand
  x.fillStyle="#22c55e";x.beginPath();x.roundRect?x.roundRect(90,110,110,110,28):x.rect(90,110,110,110);x.fill();
  x.fillStyle="#052e16";x.fillRect(112,160,66,12);x.fillRect(118,138,12,56);x.fillRect(160,138,12,56);
  x.font=`900 84px ${EN_FONT}`;
  x.fillStyle="#fff";x.textAlign="left";x.fillText("RozFit",230,195);
  x.font=`500 34px ${EN_FONT}`;x.fillStyle="#94a3b8";x.fillText("your free daily gym plan",232,240);
  const name=(profile.name||"").trim();
  const st=streak(), tw=totalWorkouts(), kl=kgLost();
  let y=470;
  if(kind==="challenge"){
    const ch=getCh(); const cs=ch?chStats(ch):{done:0}; const day=milestone||cs.done;
    y=420;
    T(milestone?`🎖 ${milestone}-day badge unlocked!`:"30-day RozFit challenge",y,58,"#86efac",800);y+=85;
    T("30 دن کا چیلنج",y,58,"#e2e8f0",700,URDU_FONT,"center",true);y+=230;
    T(String(day),y,230,"#22c55e",900);y+=85;
    T("of 30 days done",y,52,"#e2e8f0",700);y+=80;
    T(`${day} دن مکمل`,y,56,"#e2e8f0",700,URDU_FONT,"center",true);y+=60;
    // mini grid
    const s=48,gap=12,cols=10,gx=(W-(cols*s+(cols-1)*gap))/2;
    for(let i=0;i<30;i++){const cx=gx+(i%cols)*(s+gap),cy=y+Math.floor(i/cols)*(s+gap);x.fillStyle=i<day?"#22c55e":"rgba(148,163,184,.25)";x.beginPath();x.roundRect?x.roundRect(cx,cy,s,s,12):x.rect(cx,cy,s,s);x.fill()}
    y+=3*(s+gap)+60;
  }else{
    y=420;
    T("Workout complete! 💪",y,64,"#86efac",800);y+=90;
    T("آج کی ورزش مکمل",y,60,"#e2e8f0",700,URDU_FONT,"center",true);y+=130;
    T("🔥",y,110,"#ffffff",400);y+=30;
    T(String(st),y+190,220,"#ffffff",900);y+=270;
    T(`${st===1?"day":"days"} in a row`,y,56,"#e2e8f0",700);y+=85;
    T(`${st} دن مسلسل`,y,60,"#cbd5e1",700,URDU_FONT,"center",true);y+=90;
  }
  // stat boxes
  const boxes=[[String(tw),"workouts","ورزشیں"],[kl>0?kl+" kg":"—","lost","وزن کم"],[String(st),"streak","مسلسل"]];
  const bw=280,bh=240,bg=30,bx=(W-(3*bw+2*bg))/2; y=Math.max(y,1180); y=Math.min(y,1210);
  boxes.forEach((b,i)=>{const X=bx+i*(bw+bg);x.fillStyle="rgba(30,41,59,.9)";x.beginPath();x.roundRect?x.roundRect(X,y,bw,bh,30):x.rect(X,y,bw,bh);x.fill();
    x.textAlign="center";x.fillStyle="#22c55e";x.font=`900 76px ${EN_FONT}`;x.fillText(b[0],X+bw/2,y+100);
    x.fillStyle="#e2e8f0";x.font=`600 38px ${EN_FONT}`;x.fillText(b[1],X+bw/2,y+160);
    x.fillStyle="#94a3b8";x.direction="rtl";x.font=`600 36px ${URDU_FONT}`;x.fillText(b[2],X+bw/2,y+215);x.direction="ltr";});
  y+=bh+80;
  if(name){T(`— ${name}`,y,42,"#94a3b8",600);}
  // footer CTA
  x.fillStyle="#22c55e";x.beginPath();x.roundRect?x.roundRect(90,H-330,W-180,200,40):x.rect(90,H-330,W-180,200);x.fill();
  x.textAlign="center";x.fillStyle="#052e16";x.font=`900 50px ${EN_FONT}`;x.fillText("Join me free on RozFit",W/2,H-260);
  x.direction="rtl";x.font=`700 44px ${URDU_FONT}`;x.fillText("میرے ساتھ مفت جوائن کریں",W/2,H-200);x.direction="ltr";
  x.font=`600 36px ${EN_FONT}`;x.fillStyle="#94a3b8";x.fillText(APP_LINK,W/2,H-70);
  return c;
}
function openShare(kind,milestone){
  const c=drawCard(kind,milestone); const url=c.toDataURL("image/png");
  let file=null; c.toBlob(b=>{if(b)file=new File([b],"rozfit-progress.png",{type:"image/png"})},"image/png");
  const text=(kind==="challenge"?(milestone?`I just hit day ${milestone} of the 30-day RozFit challenge! 🎖`:"My 30-day RozFit challenge progress 💪"):`I finished today's workout on RozFit! 🔥 ${streak()} in a row`)+` Join me free: https://${APP_LINK}/`;
  const ov=document.createElement("div");ov.className="guide";document.body.appendChild(ov);document.body.style.overflow="hidden";
  ov.innerHTML=`<div class="gin" style="text-align:center">
    <div class="gtop"><button class="gx" id="sclose">✕</button><span>${milestone?"🎖 Badge unlocked!":"Share your progress"}</span><span></span></div>
    <img src="${url}" alt="Your RozFit progress card" class="shimg">
    <button class="btn huge" id="sshare">📤 Share to WhatsApp / Instagram</button>
    <button class="btn sec" id="ssave">⬇ Save image</button>
    <p class="mut" id="shint">Tip: you can also press and hold the picture to save it.</p></div>`;
  const close=()=>{ov.remove();document.body.style.overflow="";render()};
  $("#sclose").onclick=close;
  $("#sshare").onclick=async()=>{
    try{
      if(file&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text});return}
      if(navigator.share){await navigator.share({text,url:`https://${APP_LINK}/`});return}
    }catch(e){if(e&&e.name==="AbortError")return}
    $("#shint").textContent="Sharing isn't available here. Tap Save image, then post it from your gallery.";
  };
  $("#ssave").onclick=()=>{
    const a=document.createElement("a");a.href=url;a.download="rozfit-progress.png";document.body.appendChild(a);a.click();a.remove();
    $("#shint").textContent="If nothing downloaded, press and hold the picture and choose \"Save to Photos\".";
  };
}

/* ---------- Router ---------- */
function render(){
  if(!profile){renderOnboarding(false);return}
  $("#nav").classList.remove("hide");
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===(tab==="day"?"week":tab)));
  if(tab==="today"){viewDay=null;renderDay(todayKey())}
  else if(tab==="day")renderDay(viewDay);
  else if(tab==="week")renderWeek();
  else if(tab==="diet")renderDiet();
  else if(tab==="challenge")renderChallenge();
  else renderMe();
  window.scrollTo(0,0);
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;viewDay=null;render()});
render();

if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}}
</script>
